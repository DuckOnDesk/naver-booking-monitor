name: 사전예약 탐색 진단

# 팝업 조회가 0건일 때 네이버 응답 구조를 로그로 확인하기 위한 수동 실행 워크플로.
# 데이터 파일을 건드리지 않고 읽기만 한다.

on:
  workflow_dispatch:
    inputs:
      query:
        description: 진단할 지역 질의 (비우면 설정의 앞 2개 지역)
        required: false
        default: ""
      mode:
        description: "capacity = 100곳 상한 시험 / compare = 쉼표로 나눈 검색어들이 새 장소를 얼마나 더 잡는지 비교 / probe = 실제 브라우저로 화면을 찍고 다음 페이지 요청을 기록 (결과는 실행 브랜치 diag/에 커밋, main 제외)"
        required: false
        default: ""

permissions:
  contents: write   # probe 모드 결과(diag/)를 실행 브랜치에 커밋

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 화면 진단 (probe)
        if: inputs.mode == 'probe' && github.ref != 'refs/heads/main'
        env:
          QUERY: ${{ inputs.query }}
        run: |
          pip install playwright
          playwright install chromium
          python -u presale_page_probe.py "$QUERY" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag/
          git commit -m "diag: 팝업 검색 화면 진단 결과 [skip ci]" && git push || true

      - name: 진단 실행
        if: inputs.mode != 'probe'
        env:
          QUERY: ${{ inputs.query }}
          MODE: ${{ inputs.mode }}
        run: python -u presale_diagnose.py "$QUERY" "$MODE"
