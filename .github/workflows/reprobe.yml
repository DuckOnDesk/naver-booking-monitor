name: 운영 기간 재탐색

# 웹앱의 "운영 기간 초기화" 버튼이 .schedule_reprobe_request.json을 커밋하면 실행된다.
# 모니터 job이 돌고 있으면 그쪽이 먼저 처리하기도 하지만, 쉬는 시간대에도
# 버튼이 동작하도록 하는 경로. playwright가 필요 없어 1분 안쪽에 끝난다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".schedule_reprobe_request.json"]

permissions:
  contents: write   # schedule_cache.json 커밋/푸시용

concurrency:
  group: schedule-reprobe
  cancel-in-progress: true   # 연달아 누르면 마지막 요청만 처리하면 된다

jobs:
  reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 요청된 팝업 운영 기간 재탐색
        run: python -u check_booking.py --reprobe
