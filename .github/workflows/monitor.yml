name: 네이버 예약 모니터

on:
  schedule:
    - cron: "0 */5 * * *"   # 체인 끊겼을 때 복구용 백업
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".monitor_restart_request"]   # 이 파일 커밋으로 즉시 재시작

permissions:
  contents: write   # schedule_cache.json 자동 커밋/푸시용
  actions: write    # 다음 실행 self-trigger용

concurrency:
  group: monitor-run
  cancel-in-progress: false   # 실행 중인 것은 유지, 대기 중인 것만 교체

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests playwright

      - name: Playwright 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Chromium 설치
        run: playwright install chromium --with-deps

      - name: 예약 자리 확인
        env:
          # 이 워크플로는 자리 감시만 한다. 예약 시도는 자리를 찾았을 때
          # autobook.yml(auto_book_worker.py)을 디스패치해 그쪽에서 수행한다.
          # 여기서 직접 예약을 누르면 그동안 감시가 멈춘다.
          GITHUB_TOKEN: ${{ github.token }}   # autobook.yml 디스패치용
          CHECK_INTERVAL_SEC: "60"
          LOOP_HOURS: "5.5"
          SCHEDULE_CACHE_TTL_MIN: "60"   # 운영 기간 캐시 재탐색 주기(분), 0 = 끔
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}   # 예약창 열림/닫힘 확인용
          KAKAO_COOKIES: ${{ secrets.KAKAO_COOKIES }}
        run: python -u check_booking.py

      - name: 다음 실행 즉시 트리거
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo ${{ github.repository }}
