name: 네이버 예약 모니터

on:
  schedule:
    - cron: "0 */5 * * *"   # 체인 끊겼을 때 복구용 백업
  workflow_dispatch:
  push:
    branches: [main]
    # .monitor_restart_request 커밋으로 즉시 재시작. monitors.json은 감시 항목이
    # 하나도 없어 일시중지된 체인을 항목을 다시 켰을 때 되살리려고 넣었다.
    # (워크플로가 GITHUB_TOKEN으로 올리는 커밋은 푸시 이벤트를 만들지 않는다.)
    paths: [".monitor_restart_request", "monitors.json"]

permissions:
  contents: write   # schedule_cache.json 자동 커밋/푸시용
  actions: write    # 다음 실행 self-trigger용

concurrency:
  group: monitor-run
  cancel-in-progress: false   # 실행 중인 것은 유지, 대기 중인 것만 교체

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # 켜진 감시 항목이 하나도 없으면 나머지 스텝과 다음 실행 트리거를 모두
      # 건너뛰어 self-trigger 체인을 멈춘다 (일시중지). 종전에는 check_booking.py가
      # 바로 끝나도 트리거 스텝이 다음 런을 띄워, 빈 런이 쉬지 않고 이어졌다.
      # 항목을 다시 켜면 monitors.json 푸시로 재개된다. 5시간 cron도 여기서 멈춘다.
      - name: 감시 항목 확인
        id: gate
        run: |
          n=$(python3 -c 'import json; print(sum(1 for m in json.load(open("monitors.json")).get("monitors", []) if m.get("enabled", True)))' || echo 1)
          echo "active=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" = "0" ]; then echo "켜진 감시 항목 없음 → 일시중지 (다음 실행 트리거 안 함)"; else echo "켜진 감시 항목 ${n}개"; fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.active != '0'
        with:
          python-version: "3.12"

      - run: pip install requests playwright
        if: steps.gate.outputs.active != '0'

      - name: Playwright 캐시
        if: steps.gate.outputs.active != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      # --with-deps를 쓰지 않는다. 그 옵션은 apt-get update부터 돌리는데,
      # 2026-08-18 09:51 런이 archive.ubuntu.com 응답을 기다리며 1시간 8분을
      # 매달려 감시가 통째로 비었다 (마지막 로그가 "Get:5 ... noble-security
      # InRelease", 그 뒤로 아무 출력 없음). 브라우저 바이너리는 위 캐시에서
      # 오고, 러너 이미지에 Playwright가 쓰는 시스템 라이브러리는 이미 들어 있다.
      # timeout은 남겨 둔다 — 다른 이유로 매달려도 매달린 채로 두지 않는다.
      # 실패하면 아래 트리거 스텝이 !cancelled()라서 다음 런이 뜬다.
      - name: Chromium 설치
        if: steps.gate.outputs.active != '0'
        timeout-minutes: 5
        run: playwright install chromium

      - name: 예약 자리 확인
        if: steps.gate.outputs.active != '0'
        env:
          # 이 워크플로는 자리 감시만 한다. 예약 시도는 자리를 찾았을 때
          # autobook.yml(auto_book_worker.py)을 디스패치해 그쪽에서 수행한다.
          # 여기서 직접 예약을 누르면 그동안 감시가 멈춘다.
          GITHUB_TOKEN: ${{ github.token }}   # autobook.yml 디스패치용
          # 회차 "시작"부터 다음 회차 시작까지의 최소 간격. 한 회차가 이보다
          # 오래 걸리면 쉬지 않고 바로 다음 회차를 돈다 (check_booking.round_wait).
          CHECK_INTERVAL_SEC: "60"
          LOOP_HOURS: "5.5"
          SCHEDULE_CACHE_TTL_MIN: "60"   # 운영 기간 캐시 재탐색 주기(분), 0 = 끔
          # 재고/예약 구성이 바뀔 때 보내는 📊 알림. 시끄러우면 저장소 변수
          # STOCK_CHANGE_NTFY에 0을 넣는다 (변수가 없으면 켜진 상태가 기본).
          STOCK_CHANGE_NTFY: ${{ vars.STOCK_CHANGE_NTFY }}
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}   # 예약창 열림/닫힘 확인용
          KAKAO_COOKIES: ${{ secrets.KAKAO_COOKIES }}
        run: python -u check_booking.py

      - name: 다음 실행 즉시 트리거
        if: ${{ !cancelled() && steps.gate.outputs.active != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo ${{ github.repository }}
